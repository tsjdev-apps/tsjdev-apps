
name: Latest podcast episodes - TSJDEV Apps

on:
  # Run every Tuesday and Thursday at 07:00 Germany time
  schedule:
    - cron: "0 7 * * 2,4"
      timezone: "Europe/Berlin"

  # Allow manual execution at any time
  workflow_dispatch:

# Grants permission to update the repository
permissions:
  contents: write

jobs:
  update-readme-with-podcast:
    name: Update README with latest podcast episodes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download podcast RSS feed
        run: |
          curl --fail --silent --show-error \
            --location \
            --retry 3 \
            --max-time 45 \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/127.0.0.0 Safari/537.36" \
            -H "Accept: application/rss+xml, application/xml, text/xml" \
            -o "$RUNNER_TEMP/podcast-feed.xml" \
            "https://www.tsjdev-apps-podcast.com/feed/"

      - name: Update README
        env:
          FEED_FILE: ${{ runner.temp }}/podcast-feed.xml
        run: |
          python3 - <<'PY'
          import os
          import re
          import html
          import email.utils
          import xml.etree.ElementTree as ET
          from pathlib import Path
          from urllib.parse import urljoin, urlparse

          FEED_URL = "https://www.tsjdev-apps-podcast.com/feed/"
          MAX_EPISODES = 5

          # Parse podcast RSS feed
          root = ET.parse(os.environ["FEED_FILE"]).getroot()
          episodes = []

          for item in root.findall("./channel/item"):
              title = html.unescape(
                  item.findtext("title") or ""
              )
              title = " ".join(title.split())

              link = (item.findtext("link") or "").strip()
              published = item.findtext("pubDate") or ""

              if not title or not link:
                  continue

              link = urljoin(FEED_URL, link)

              if urlparse(link).scheme not in ("http", "https"):
                  continue

              # Extract episode number from permalink
              match = re.search(
                  r"/(e\d{3,})/?(?:[?#].*)?$",
                  link,
                  re.IGNORECASE,
              )

              if match:
                  episode_number = match.group(1).upper()

                  if not re.match(
                      r"^E\d{3,}\b",
                      title,
                      re.IGNORECASE,
                  ):
                      title = f"{episode_number}: {title}"

              # Escape Markdown characters
              title = title.replace("\\", "\\\\")
              title = title.replace("[", "\\[")
              title = title.replace("]", "\\]")

              try:
                  date = email.utils.parsedate_to_datetime(
                      published
                  ).timestamp()
              except (ValueError, TypeError, OverflowError):
                  date = 0

              episodes.append((date, title, link))

          if not episodes:
              raise RuntimeError("No podcast episodes found")

          # Sort by publication date, newest first
          episodes.sort(
              key=lambda episode: episode[0],
              reverse=True,
          )

          # Generate Markdown for latest episodes
          markdown = "\n".join(
              f"- [{title}]({link})"
              for _, title, link in episodes[:MAX_EPISODES]
          )

          # Locate podcast section in README
          readme = Path("README.md")
          content = readme.read_text(encoding="utf-8")

          start = "<!-- PODCAST-LIST:START -->"
          end = "<!-- PODCAST-LIST:END -->"

          pattern = re.compile(
              f"({re.escape(start)}).*?({re.escape(end)})",
              re.DOTALL,
          )

          updated, count = pattern.subn(
              lambda m: (
                  f"{m.group(1)}\n{markdown}\n{m.group(2)}"
              ),
              content,
          )

          if count != 1:
              raise RuntimeError(
                  "Expected exactly one podcast README section"
              )

          if updated != content:
              readme.write_text(
                  updated,
                  encoding="utf-8",
              )
              print("README updated")
          else:
              print("No changes required")

          print(f"Found {len(episodes)} podcast episodes")
          PY

      - name: Commit README changes
        run: |
          if git diff --quiet -- README.md; then
            echo "No changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md
          git commit -m "Update latest podcast episodes"

          # Integrate changes made by other workflows
          git pull --rebase origin "$GITHUB_REF_NAME"

          git push origin "HEAD:$GITHUB_REF_NAME"
